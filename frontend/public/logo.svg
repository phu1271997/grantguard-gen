<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d2b"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#7be0aa"/>
      <stop offset="0.55" stop-color="#1f7a4d"/>
      <stop offset="1"    stop-color="#0e4a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#1f7a4d" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1f7a4d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 92 L386 140 V258 C386 332 331 386 256 414 C181 386 126 332 126 258 V140 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- inner motif: a coin/vault stack behind the shield silhouette -->
  <g clip-path="url(#shieldClip)" fill="none" stroke="url(#mark)"
     stroke-width="20" stroke-linecap="round" opacity="0.95">
    <!-- three ledger bars, staggered like milestone gates -->
    <path d="M170 316 H342"/>
    <path d="M170 260 H342"/>
    <path d="M170 204 H342"/>
    <!-- the "checkmark" that only appears when the top bar is honored -->
    <path d="M198 208 L246 240 L332 168"
          stroke-width="26" opacity="1"/>
  </g>

  <!-- shield outline -->
  <path d="M256 92 L386 140 V258 C386 332 331 386 256 414 C181 386 126 332 126 258 V140 Z"
        fill="none" stroke="url(#mark)" stroke-width="26" stroke-linejoin="round"/>
</svg>
